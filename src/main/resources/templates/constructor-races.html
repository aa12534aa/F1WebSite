<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Constructor Race History</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="constructor-races" th:attr="data-constructor-id=${constructorId}">

<th:block th:replace="~{fragments/navbar :: navbar('constructors')}"></th:block>

<div class="container">
    <div class="header-section">
        <a id="profile-back-link" href="#" class="back-link">&larr; Back to Constructor Profile</a>
        <h1 id="page-title">Constructor Race History</h1>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Grand Prix</th>
                <th>Country</th>
                <th>Driver</th>
                <th class="text-center">Position</th>
                <th class="text-right">Points Scored</th>
            </tr>
            </thead>
            <tbody id="races-body">
            <tr><td colspan="6">Loading records...</td></tr>
            </tbody>
        </table>

        <div class="pagination">
            <button class="page-btn" id="prev-btn" type="button">Previous</button>
            <div class="page-info" id="page-info">Page 1 of 1</div>
            <button class="page-btn" id="next-btn" type="button">Next</button>
        </div>
    </div>
</div>

</body>
</html>
