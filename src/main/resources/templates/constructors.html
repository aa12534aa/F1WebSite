<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1 Constructors</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="constructors">

<th:block th:replace="~{fragments/navbar :: navbar('constructors')}"></th:block>

<div class="container">
    <div class="header-section">
        <div class="header-section--split">
            <h1>F1 Constructors Registry</h1>
            <button id="create-constructor-btn" class="btn-primary" type="button" data-open-create="constructors" data-employee-action="true" hidden>Create Constructor</button>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search by name...">
            <button id="search-btn" class="search-btn" type="button">Search</button>
        </div>
    </div>

    <div id="status-message">Loading constructors data...</div>

    <div class="card" id="data-container" hidden>
        <table>
            <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th class="text-right">Wins</th>
                <th class="text-right">Races</th>
                <th class="text-right">Action</th>
            </tr>
            </thead>
            <tbody id="all-constructors-body"></tbody>
        </table>

        <div class="pagination">
            <button class="page-btn" id="prev-btn" type="button">Previous</button>
            <div class="page-info" id="page-info">Page 1 of 1</div>
            <button class="page-btn" id="next-btn" type="button">Next</button>
        </div>
    </div>
</div>
</body>
</html>
