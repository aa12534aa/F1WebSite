<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1 Drivers</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="drivers">

<th:block th:replace="~{fragments/navbar :: navbar('drivers')}"></th:block>

<div class="container">
    <div class="header-section">
        <h1>F1 Drivers Registry</h1>
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search by name...">
            <button id="search-btn" class="search-btn" type="button">Search</button>
        </div>
    </div>

    <div id="status-message">Loading drivers data...</div>

    <div class="card" id="data-container" hidden>
        <table>
            <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th class="text-right">Wins</th>
                <th class="text-right">Races</th>
                <th class="text-right">Action</th>
            </tr>
            </thead>
            <tbody id="all-drivers-body"></tbody>
        </table>

        <div class="pagination">
            <button class="page-btn" id="prev-btn" type="button">Previous</button>
            <div class="page-info" id="page-info">Page 1 of 1</div>
            <button class="page-btn" id="next-btn" type="button">Next</button>
        </div>
    </div>
</div>
</body>
</html>
