<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qualifying</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="race-qualifying" th:attr="data-race-id=${raceId}">

<th:block th:replace="~{fragments/navbar :: navbar('races')}"></th:block>

<div class="container">
    <a href="#" id="back-link" class="back-link">&larr; Back to Race Details</a>

    <div class="header-section">
        <h1 class="page-title"><span id="race-name">Race</span> - Qualifying</h1>
    </div>

    <div id="status-message">Loading qualifying data...</div>

    <div id="data-container" hidden>
        <div class="card">
            <table>
                <thead>
                <tr>
                    <th class="text-center">Pos</th>
                    <th>Driver</th>
                    <th>Nationality</th>
                    <th>Constructor</th>
                </tr>
                </thead>
                <tbody id="qualifying-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
