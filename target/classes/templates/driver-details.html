<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Profile</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="driver-details" th:attr="data-driver-id=${driverId}">

<th:block th:replace="~{fragments/navbar :: navbar('drivers')}"></th:block>

<div class="container">
    <div class="driver-header">
        <div>
            <a href="/drivers" class="back-link">&larr; Back to Drivers</a>
            <h1 id="driver-name">Loading Profile...</h1>
            <p id="driver-nat" style="color: #6b7280; margin: 0;"></p>
            <a id="wiki-url" href="#" target="_blank" class="wiki-link">Biography on Wikipedia &rarr;</a>
        </div>
        <div class="action-bar">
            <!-- Dynamiczny link do wyścigów wstrzykiwany przez JS -->
            <a id="races-link" href="#" class="btn-primary">View Race History</a>
        </div>
    </div>

    <div class="grid-stats">
        <div class="stat-card"><div class="label">Total Races</div><div class="num" id="stat-races">-</div></div>
        <div class="stat-card"><div class="label">Career Points</div><div class="num" id="stat-points">-</div></div>
        <div class="stat-card"><div class="label">Pole Positions</div><div class="num" id="stat-poles">-</div></div>
        <div class="stat-card"><div class="label">Total Wins</div><div class="num" id="stat-wins">-</div></div>
    </div>

    <div class="card">
        <h3>Podium Breakdown</h3>
        <table>
            <thead>
            <tr>
                <th>P1</th>
                <th>P2</th>
                <th>P3</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td id="p1-count" style="font-weight: bold; color: #e10600;">-</td>
                <td id="p2-count">-</td>
                <td id="p3-count">-</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h3>Best Performing Circuits</h3>
        <table>
            <thead>
            <tr>
                <th>Circuit Name</th>
                <th>Country</th>
                <th>Wins</th>
            </tr>
            </thead>
            <tbody id="best-circuits-body">
            <tr><td colspan="4">No circuit data available.</td></tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
