<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1 Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="home">

<th:block th:replace="~{fragments/navbar :: navbar('home')}"></th:block>

<div class="container">
    <h1 class="page-title">Dashboard</h1>
    <div id="status-message">Loading dashboard...</div>

    <div class="dashboard-grid" id="dashboard-content" hidden>
        <!-- Top Drivers -->
        <div class="card">
            <h2>Top 10 Drivers by Wins</h2>
            <table>
                <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th class="text-right">Wins</th>
                    <th class="text-right">Races</th>
                </tr>
                </thead>
                <tbody id="top-drivers-body"></tbody>
            </table>
        </div>

        <!-- Top Constructors -->
        <div class="card">
            <h2>Top 10 Constructors by Wins</h2>
            <table>
                <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th class="text-right">Wins</th>
                    <th class="text-right">Races</th>
                </tr>
                </thead>
                <tbody id="top-constructors-body"></tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
