<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1 Races</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="races">

<th:block th:replace="~{fragments/navbar :: navbar('races')}"></th:block>

<div class="container">
    <div class="header-section">
        <div class="header-section--split">
            <h1>F1 Races Registry</h1>
            <button id="create-race-btn" class="btn-primary" type="button" data-open-create="races" data-employee-action="true" hidden>Create Race</button>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search by race name or date...">
            <button id="search-btn" class="search-btn" type="button">Search</button>
        </div>
    </div>

    <div id="status-message">Loading races data...</div>

    <div class="card" id="data-container" hidden>
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Grand Prix</th>
                <th>Circuit</th>
                <th>Country</th>
                <th>Winner</th>
                <th>Constructor</th>
                <th>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        Sprint
                        <select id="sprint-filter" style="padding: 2px 4px; border-radius: 4px;">
                            <option value="both">Both</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                </th>
                <th class="text-right">Action</th>
            </tr>
            </thead>
            <tbody id="all-races-body"></tbody>
        </table>

        <div class="pagination">
            <button class="page-btn" id="prev-btn" type="button">Previous</button>
            <div class="page-info" id="page-info">Page 1 of 1</div>
            <button class="page-btn" id="next-btn" type="button">Next</button>
        </div>
    </div>
</div>
</body>
</html>
