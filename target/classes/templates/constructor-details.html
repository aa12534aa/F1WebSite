<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Constructor Profile</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        nav { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 20px; font-weight: bold; text-decoration: none; color: #000; }
        .logo span { color: #e10600; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #4b5563; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: #e10600; }
        .logout-btn { background: transparent; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .constructor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-link { text-decoration: none; color: #6b7280; font-size: 14px; }
        .back-link:hover { color: #000; }
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border: 1px solid #e5e7eb; border-radius: 8px; text-align: center; }
        .stat-card .num { font-size: 28px; font-weight: bold; color: #e10600; margin-top: 5px; }
        .stat-card .label { font-size: 12px; color: #6b7280; text-transform: uppercase; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 25px; margin-bottom: 20px; }
        .action-bar { display: flex; justify-content: flex-start; margin-top: 20px; }
        .btn-primary { background: #e10600; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .btn-primary:hover { background: #b80500; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #f3f4f6; text-align: left; }
        th { color: #6b7280; font-size: 12px; text-transform: uppercase; }
        .wiki-link { display: inline-block; margin-top: 10px; color: #2563eb; text-decoration: none; }
        .wiki-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<nav>
    <div class="nav-left">
        <a href="/home" class="logo">JSGrandPrixHub</a>
        <div class="nav-links">
            <a href="/home">Dashboard</a>
            <a href="/drivers">Drivers</a>
            <a href="/constructors" class="active">Constructors</a>
            <a href="/circuits">Circuits</a>
            <a href="/races">Races</a>
        </div>
    </div>
    <button id="auth-btn" class="logout-btn" onclick="handleAuthAction()">Logout</button>
</nav>

<div class="container">
    <div class="constructor-header">
        <div>
            <a href="/constructors" class="back-link">&larr; Back to Constructors</a>
            <h1 id="constructor-name">Loading Profile...</h1>
            <p id="constructor-nat" style="color: #6b7280; margin: 0;"></p>
        </div>
        <div class="action-bar">
            <!-- Dynamiczny link do wyścigów konstruktora -->
            <a id="races-link" href="#" class="btn-primary">View Race History</a>
        </div>
    </div>

    <div class="grid-stats">
        <div class="stat-card"><div class="label">Total Races</div><div class="num" id="stat-races">-</div></div>
        <div class="stat-card"><div class="label">Total Points</div><div class="num" id="stat-points">-</div></div>
        <div class="stat-card"><div class="label">Total Wins</div><div class="num" id="stat-wins">-</div></div>
    </div>

    <div class="card">
        <h3>Podium Breakdown</h3>
        <table>
            <thead>
            <tr>
                <th>P1 (Wins)</th>
                <th>P2 (Second Places)</th>
                <th>P3 (Third Places)</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td id="p1-count" style="font-weight: bold; color: #e10600;">-</td>
                <td id="p2-count">-</td>
                <td id="p3-count">-</td>
            </tr>
            </tbody>
        </table>
        <a id="wiki-url" href="#" target="_blank" class="wiki-link">Biography on Wikipedia &rarr;</a>
    </div>
</div>

<script th:inline="javascript">
    const constructorId = [[${constructorId}]];

    function handleAuthAction() { localStorage.removeItem('token'); window.location.href = '/login'; }

    function updateAuthButton() {
        const authBtn = document.getElementById('auth-btn');
        const token = localStorage.getItem('token');
        authBtn.innerText = token ? 'Logout' : 'Login';
    }

    async function loadConstructorDetails() {
        updateAuthButton();

        const token = localStorage.getItem('token');
        const headers = {};
        if (token) {
            headers['Authorization'] = 'Bearer ' + token;
        }

        document.getElementById('races-link').href = `/constructors/${constructorId}/races`;

        try {
            const response = await fetch(`/api/constructors/${constructorId}`, { headers });

            if (response.status === 401 || response.status === 403) { logout(); return; }
            if (!response.ok) throw new Error("Constructor not found");

            const constructorData = await response.json();

            // Mapowanie danych z API do HTML
            document.getElementById('constructor-name').innerText = constructorData.name;

            // Opcjonalne ukrywanie narodowości, jeśli obiekt z API tego nie posiada
            if(constructorData.nationality) {
                document.getElementById('constructor-nat').innerText = `Nationality: ${constructorData.nationality}`;
            }

            // Statystyki główne
            document.getElementById('stat-races').innerText = constructorData.numOfRaces;
            document.getElementById('stat-points').innerText = constructorData.gainedPoints;
            document.getElementById('stat-wins').innerText = constructorData.firstPlaces;

            // Podium Breakdown z uwzględnieniem 2 i 3 miejsc
            document.getElementById('p1-count').innerText = constructorData.firstPlaces;
            document.getElementById('p2-count').innerText = constructorData.secondPlaces;
            document.getElementById('p3-count').innerText = constructorData.thirdPlaces;

            // Opcjonalny link do Wikipedii (jeśli występuje w API)
            if (constructorData.url) {
                document.getElementById('wiki-url').href = constructorData.url;
            } else {
                document.getElementById('wiki-url').style.display = 'none';
            }

        } catch (e) {
            document.getElementById('constructor-name').innerText = "Error loading constructor profile.";
        }
    }

    document.addEventListener('DOMContentLoaded', loadConstructorDetails);
</script>
</body>
</html>
