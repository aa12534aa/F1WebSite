<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Race Details</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="race-details" th:attr="data-race-id=${raceId}">

<th:block th:replace="~{fragments/navbar :: navbar('races')}"></th:block>

<div class="container">
    <a href="/races" class="back-link">&larr; Back to Races</a>

    <div id="status-message">Loading race details...</div>

    <div id="data-container" hidden>
        <div class="race-header">
            <h1 class="race-title" id="race-name">Loading...</h1>
            <p class="race-meta">Date: <strong id="race-date"></strong></p>
            <p class="race-meta">
                Circuit: <a href="#" id="race-circuit" class="circuit-link"></a>
                (<span id="race-country"></span>)
            </p>

            <div class="action-buttons">
                <a href="#" id="btn-results" class="action-btn">View Race Results</a>
                <a href="#" id="btn-qualifying" class="action-btn">View Qualifying</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
