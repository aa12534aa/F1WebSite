<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Circuit Details</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/site.js}"></script>
</head>
<body data-page="circuit-details" th:attr="data-circuit-id=${circuitId}">

<th:block th:replace="~{fragments/navbar :: navbar('circuits')}"></th:block>

<div class="container">
    <a href="/circuits" class="back-link">&larr; Back to Circuits</a>

    <div id="status-message">Loading circuit details...</div>

    <div id="data-container" hidden>

        <div class="circuit-header">
            <h1 class="circuit-title" id="circuit-name">Loading...</h1>
            <p class="circuit-meta">Country: <strong id="circuit-country"></strong></p>
            <p class="circuit-meta">Total Races Hosted: <strong id="circuit-races"></strong></p>
            <a href="#" id="circuit-url" target="_blank" class="wiki-link">Read more on Wikipedia &nearr;</a>
        </div>

        <h2 class="section-title">Most Successful Drivers</h2>
        <div class="card">
            <table>
                <thead>
                <tr>
                    <th class="text-center">Rank</th>
                    <th>Driver</th>
                    <th>Nationality</th>
                    <th class="text-right">Wins</th>
                </tr>
                </thead>
                <tbody id="drivers-body">
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
